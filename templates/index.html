<!DOCTYPE html>
<html>

<head>
    <title>Model Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>
    <div class="container my-3 p-5 shadow">
        <h1>Explore Game Tech : Ratings </h1>
        <form action="/predict" method="post" class="p-5">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="peak_players" class="form-label">Peak Players:</label>
                    <input required type="text" class="form-control" id="peak_players" name="peak_players">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="positive_reviews" class="form-label">Positive Reviews:</label>
                    <input required type="text" class="form-control" id="positive_reviews" name="positive_reviews">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="negative_reviews" class="form-label">Negative Reviews:</label>
                    <input required type="text" class="form-control" id="negative_reviews" name="negative_reviews">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="total_reviews" class="form-label">Total Reviews:</label>
                    <input required type="text" class="form-control" id="total_reviews" name="total_reviews">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="review_percentage" class="form-label">Review Percentage:</label>
                    <input required type="text" class="form-control" id="review_percentage" name="review_percentage">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="players_right_now" class="form-label">Current Players:</label>
                    <input required type="text" class="form-control" id="players_right_now" name="players_right_now">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="24_hour_peak" class="form-label">Hour Peak (24 Hour):</label>
                    <input required type="text" class="form-control" id="24_hour_peak" name="24_hour_peak">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="all_time_peak" class="form-label">All Time Peak:</label>
                    <input required type="text" class="form-control" id="all_time_peak" name="all_time_peak">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="engineSelect" class="form-label">Select Engine and SDKs:</label>
                    <select class="form-control" id="engineSelect" name="engineSelect" class="w-50" required>
                        <option value="engine gamemaker">Engine:gamemaker</option>
                        <option value="engine renpy sdk sdl">Engine:renpy Sdk:sdl</option>
                        <option value="engine unity">Engine:unity</option>
                        <option value="engine unity sdk curl">Engine:unity Sdk:curl</option>
                        <option value="engine unity sdk oculusxrplugin sdk openvr">Engine:unity Sdk:oculusxrplugin Sdk:openvr</option>
                        <option value="engine unity sdk openvr">Engine:unity Sdk:openvr</option>
                        <option value="engine unity sdk photon">Engine:unity Sdk:photon</option>
                        <option value="engine unity sdk steamworksnet sdk curl">Engine:unity Sdk:steamworksnet Sdk:curl
                        </option>
                        <option
                            value="engine unreal sdk nvidia apex sdk nvidia nsight aftermath sdk nvidia physx sdk oculusxrplugin sdk openvr sdk vorbi">
                            Engine:unreal Sdk:nvidia apex Sdk:nvidia nsight aftermath Sdk:nvidia physx Sdk:oculusxrplugin Sdk:openvr Sdk:vorbis</option>
                        <option value="sdk nwjs sdk nodejs">Sdk:nwjs Sdk:nodejs</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary me-3">Submit</button>
                    <button type="reset" class="btn btn-danger">Reset</button>
                </div>
            </div>
        </form>


        {% if prediction %}
        <h2>Rating: {{ prediction }}</h2>
        {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
