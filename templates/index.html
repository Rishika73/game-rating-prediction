<!DOCTYPE html>
<html>

<head>
    <title>Model Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>
    <div class="container my-3 p-5 shadow">
        <h1>Explore Game Tech : Ratings</h1>

        <form action="/predict" method="post" class="p-5">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="peak_players" class="form-label">Peak Players:</label>
                    <input required type="text" class="form-control" id="peak_players" name="peak_players"
                        value="{{ form_data.get('peak_players', '') if form_data else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="positive_reviews" class="form-label">Positive Reviews:</label>
                    <input required type="text" class="form-control" id="positive_reviews" name="positive_reviews"
                        value="{{ form_data.get('positive_reviews', '') if form_data else '' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="negative_reviews" class="form-label">Negative Reviews:</label>
                    <input required type="text" class="form-control" id="negative_reviews" name="negative_reviews"
                        value="{{ form_data.get('negative_reviews', '') if form_data else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="total_reviews" class="form-label">Total Reviews:</label>
                    <input required type="text" class="form-control" id="total_reviews" name="total_reviews"
                        value="{{ form_data.get('total_reviews', '') if form_data else '' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="review_percentage" class="form-label">Review Percentage:</label>
                    <input required type="text" class="form-control" id="review_percentage" name="review_percentage"
                        value="{{ form_data.get('review_percentage', '') if form_data else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="players_right_now" class="form-label">Current Players:</label>
                    <input required type="text" class="form-control" id="players_right_now" name="players_right_now"
                        value="{{ form_data.get('players_right_now', '') if form_data else '' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="24_hour_peak" class="form-label">Hour Peak (24 Hour):</label>
                    <input required type="text" class="form-control" id="24_hour_peak" name="24_hour_peak"
                        value="{{ form_data.get('24_hour_peak', '') if form_data else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="all_time_peak" class="form-label">All Time Peak:</label>
                    <input required type="text" class="form-control" id="all_time_peak" name="all_time_peak"
                        value="{{ form_data.get('all_time_peak', '') if form_data else '' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="engineSelect" class="form-label">Select Engine and SDKs:</label>

                    <select class="form-control" id="engineSelect" name="engineSelect" required>

                        <option value="engine gamemaker" {% if form_data and
                            form_data.get('engineSelect')=='engine gamemaker' %}selected{% endif %}>
                            Engine:gamemaker
                        </option>

                        <option value="engine renpy sdk sdl" {% if form_data and
                            form_data.get('engineSelect')=='engine renpy sdk sdl' %}selected{% endif %}>
                            Engine:renpy Sdk:sdl
                        </option>

                        <option value="engine unity" {% if form_data and form_data.get('engineSelect')=='engine unity'
                            %}selected{% endif %}>
                            Engine:unity
                        </option>

                        <option value="engine unity sdk curl" {% if form_data and
                            form_data.get('engineSelect')=='engine unity sdk curl' %}selected{% endif %}>
                            Engine:unity Sdk:curl
                        </option>

                        <option value="engine unity sdk oculusxrplugin sdk openvr" {% if form_data and
                            form_data.get('engineSelect')=='engine unity sdk oculusxrplugin sdk openvr' %}selected{%
                            endif %}>
                            Engine:unity Sdk:oculusxrplugin Sdk:openvr
                        </option>

                        <option value="engine unity sdk openvr" {% if form_data and
                            form_data.get('engineSelect')=='engine unity sdk openvr' %}selected{% endif %}>
                            Engine:unity Sdk:openvr
                        </option>

                        <option value="engine unity sdk photon" {% if form_data and
                            form_data.get('engineSelect')=='engine unity sdk photon' %}selected{% endif %}>
                            Engine:unity Sdk:photon
                        </option>

                        <option value="engine unity sdk steamworksnet sdk curl" {% if form_data and
                            form_data.get('engineSelect')=='engine unity sdk steamworksnet sdk curl' %}selected{% endif
                            %}>
                            Engine:unity Sdk:steamworksnet Sdk:curl
                        </option>

                        <option
                            value="engine unreal sdk nvidia apex sdk nvidia nsight aftermath sdk nvidia physx sdk oculusxrplugin sdk openvr sdk vorbi"
                            {% if form_data and
                            form_data.get('engineSelect')=='engine unreal sdk nvidia apex sdk nvidia nsight aftermath sdk nvidia physx sdk oculusxrplugin sdk openvr sdk vorbi'
                            %}selected{% endif %}>
                            Engine:unreal Sdk:nvidia apex Sdk:nvidia nsight aftermath
                            Sdk:nvidia physx Sdk:oculusxrplugin Sdk:openvr Sdk:vorbis
                        </option>

                        <option value="sdk nwjs sdk nodejs" {% if form_data and
                            form_data.get('engineSelect')=='sdk nwjs sdk nodejs' %}selected{% endif %}>
                            Sdk:nwjs Sdk:nodejs
                        </option>

                    </select>
                </div>

                <div class="col-md-6 mb-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary me-3">Submit</button>
                    <button type="reset" class="btn btn-danger">Reset</button>
                </div>
            </div>
        </form>

        {% if prediction is not none %}
        <div class="mt-3">
            <h2>Rating: {{ prediction }}</h2>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>
</body>

</html>
